name: Deploy VerveStacks Dashboard

on:
  push:
    branches: [ "RS-IIS-Deployment-on-LocalMachine" ]
  workflow_dispatch: {}

env:
  # Flags
  Update_Data_On_Local: "false"
  Update_Data_On_Hetzner: "false"
  RUN_ONLY_DB_STEP: "false"      # 'true' → only DB update pipeline; 'false' → full deploy
  SYNC_KANVAULT_ZIP: "false"      # 'true' → extract latest vervestacks_data_*.zip into DEPLOY_ROOT

  # Control how Python environment is handled
  # CREATE_NEW_VENV = "true"  → create/refresh python-service\.venv per deploy
  # CREATE_NEW_VENV = "false" → reuse STATIC_VENV_ROOT
  CREATE_NEW_VENV: "false"
  STATIC_VENV_ROOT: "C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python39"

  # Base Python EXE used ONLY to create new venvs
  PYTHON_EXE: "C:\\Users\\Administrator\\AppData\\Local\\Programs\\Python\\Python39\\python.exe"

  # NEW: control whether start.bat opens visible consoles
  SHOW_START_CONSOLES: "true"

  # Deployment roots
  DEPLOY_ROOT: "C:\\inetpub\\VerveStacks"
  DATA_ROOT: "C:\\inetpub\\VerveStacks\\data"

  # Local data source root (your main local data source)
  LOCAL_DATA_SOURCE_ROOT: "${{ github.workspace }}\\data"

  # Base UNC share (YAML-escaped; runtime value is \\192.168.0.7\kanvault)
  KANVAULT_SHARE: "\\\\192.168.0.7\\kanvault"

  # Destination data paths
  DEST_OSM: "C:\\inetpub\\VerveStacks\\data\\OSM-kan-prebuilt"
  DEST_TRANSMISSION: "C:\\inetpub\\VerveStacks\\data\\transmission_line_generation"
  DEST_ATLITE: "C:\\inetpub\\VerveStacks\\data\\hourly_profiles\\Atlite_data"
  DEST_REZONING: "C:\\inetpub\\VerveStacks\\data\\REZoning"

  # Application subroot (beneath DEPLOY_ROOT)
  APP_SUBROOT: "vervestacks-dashboard"

  # App source root (what you copy from)
  APP_SOURCE_ROOT: "${{ github.workspace }}\\vervestacks-dashboard"

  # Full repo root (what you asked to copy 1:1)
  REPO_SOURCE_ROOT: "${{ github.workspace }}"

  # Log root folder (persistent location outside workspace)
  LOG_ROOT: "C:\\GitHub\\kanors-emr\\self-hosted-runner\\actions-runner-on-local-19\\Logs"

jobs:
  deploy:
    runs-on: [ self-hosted, Windows, X64,]

    steps:
      # =====================
      # CHECKOUT REPOSITORY
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # INIT WORKFLOW RUN LOG
      # =====================
      - name: Init workflow run log file
        shell: powershell
        run: |
          $stepName = 'Init workflow run log file'
          $logRoot = $env:LOG_ROOT

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host '### STEP FAILED: Init workflow run log file'
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            exit 1
          }

          if (-not (Test-Path $logRoot)) {
            New-Item -ItemType Directory -Path $logRoot | Out-Null
          }

          $timestamp = Get-Date -Format 'yyyy-MM-ddTHH-mm-ss'
          # Log file name: Deploy_<timestamp>.log
          $fileName  = "Deploy_$timestamp.log"
          $safeName  = ($fileName -replace '[\\/:*?""<>|]', '_')
          $logFile   = Join-Path $logRoot $safeName

          'STEP     : Init workflow run log file' | Out-File -FilePath $logFile -Encoding UTF8
          ('Workflow : {0}' -f $env:GITHUB_WORKFLOW)   | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Run ID   : {0}' -f $env:GITHUB_RUN_ID)     | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Job      : {0}' -f $env:GITHUB_JOB)        | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Repo     : {0}' -f $env:GITHUB_REPOSITORY) | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Commit   : {0}' -f $env:GITHUB_SHA)        | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Actor    : {0}' -f $env:GITHUB_ACTOR)      | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Workspace: {0}' -f $env:GITHUB_WORKSPACE)  | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('Started  : {0}' -f (Get-Date -Format o))   | Out-File -FilePath $logFile -Encoding UTF8 -Append
          ('SYNC_KANVAULT_ZIP: {0}' -f $env:SYNC_KANVAULT_ZIP) | Out-File -FilePath $logFile -Encoding UTF8 -Append
          '--------------------------------------'     | Out-File -FilePath $logFile -Encoding UTF8 -Append

          "LOG_FILE=$logFile" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          exit 0

      # =====================
      # MAP UNC SHARE (kanvault)
      # =====================
      - name: Map kanvault share
        if: (env.Update_Data_On_Local == 'true' || env.SYNC_KANVAULT_ZIP == 'true') && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        env:
          KANVAULT_PASSWORD: ${{ secrets.KANVAULT_PASSWORD }}
        run: |
          $stepName = 'Map kanvault share'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host ('### STEP FAILED: {0}' -f $stepName)
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host ('=== [{0}] ===' -f $stepName)
          Write-Host ("Mapping {0} with user 'amit'" -f $env:KANVAULT_SHARE)

          try {
            Write-Host 'Attempting to delete existing mapping...'
            net use $env:KANVAULT_SHARE /delete /y
          } catch {
            Write-Host 'No existing mapping or delete failed. Continuing.'
          }

          net use $env:KANVAULT_SHARE /user:amit $env:KANVAULT_PASSWORD
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("### ERROR DETAIL: net use failed with exit code {0}." -f $LASTEXITCODE)
            if ($log) { Stop-Transcript | Out-Null }
            exit $LASTEXITCODE
          }

          Write-Host 'UNC network share mapped successfully.'

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 1a) EXTRACT LATEST KANVAULT DATA ZIP (optional)
      # ==========================================================
      - name: Extract latest Kanvault data ZIP
        if: env.SYNC_KANVAULT_ZIP == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Extract latest Kanvault data ZIP'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host ('### STEP FAILED: {0}' -f $stepName)
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host ('=== [{0}] ===' -f $stepName)

          $sourceDir  = Join-Path $env:KANVAULT_SHARE 'KanORS_Data\VerveStacks'
          $stageDir   = Join-Path $env:DEPLOY_ROOT 'data\_kanvault_zip_stage'
          $markerFile = Join-Path $stageDir '_last_zip_processed.txt'
          $deployRoot = $env:DEPLOY_ROOT

          Write-Host ("ZIP source dir = {0}" -f $sourceDir)

          if (-not (Test-Path $sourceDir)) {
            Write-Host ("WARNING: ZIP source directory does not exist: {0} (skipping ZIP extract)" -f $sourceDir)
            if ($log) { Stop-Transcript | Out-Null }
            exit 0
          }

          if (-not (Test-Path $stageDir)) {
            New-Item -ItemType Directory -Path $stageDir | Out-Null
          }

          $latestZip = Get-ChildItem -Path $sourceDir -Filter 'vervestacks_data_*.zip' -File -ErrorAction Stop |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $latestZip) {
            Write-Host 'No matching ZIP found (vervestacks_data_*.zip). Skipping.'
            if ($log) { Stop-Transcript | Out-Null }
            exit 0
          }

          Write-Host ("Latest ZIP: {0} (LastWriteTime={1})" -f $latestZip.Name, $latestZip.LastWriteTime)

          if (Test-Path $markerFile) {
            $prev = (Get-Content -Path $markerFile -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($prev -and ($prev.Trim() -eq $latestZip.Name)) {
              Write-Host 'Latest ZIP already processed. Skipping.'
              if ($log) { Stop-Transcript | Out-Null }
              exit 0
            }
          }

          $localZipPath = Join-Path $stageDir $latestZip.Name
          Write-Host ("Copying ZIP to stage: {0}" -f $localZipPath)
          Copy-Item -Path $latestZip.FullName -Destination $localZipPath -Force

          if (-not (Test-Path $localZipPath)) {
            throw "ZIP copy failed. Not found in staging: $localZipPath"
          }

          Write-Host ("Extracting ZIP directly into Deploy Root: {0}" -f $deployRoot)
          Expand-Archive -Path $localZipPath -DestinationPath $deployRoot -Force

          Set-Content -Path $markerFile -Value $latestZip.Name -Encoding UTF8
          Write-Host 'ZIP extracted successfully and marker updated.'

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 1) ALL DATA SYNC (KANVAULT + LOCAL) IN ONE STEP
      # ==========================================================
      - name: Sync all data (kanvault + local) to IIS
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Sync all data (kanvault + local) to IIS'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host ('### STEP FAILED: {0}' -f $stepName)
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host ('=== [{0}] ===' -f $stepName)

          $shareRoot = $env:KANVAULT_SHARE
          $verveRoot = Join-Path $shareRoot 'KanORS_Data\VerveStacks'
          $rezRoot   = Join-Path $shareRoot 'KanORS_Data\REZoning data'

          Write-Host ('VerveStacks UNC root = {0}' -f $verveRoot)
          Write-Host ('REZoning UNC root    = {0}' -f $rezRoot)

          $syncJobs = @(
            @{ Name = 'OSM-kan-prebuilt'
               Source = Join-Path $verveRoot 'OSM-kan-prebuilt'
               Dest   = $env:DEST_OSM },
            @{ Name = 'transmission_line_generation'
               Source = Join-Path $verveRoot 'transmission_line_generation'
               Dest   = $env:DEST_TRANSMISSION },
            @{ Name = 'Atlite_data_optimized'
               Source = Join-Path $rezRoot 'Atlite_data\Atlite_data_optimized'
               Dest   = $env:DEST_ATLITE },
            @{ Name = 'REZoning_world_data'
               Source = Join-Path $rezRoot 'REZoning_world_data'
               Dest   = $env:DEST_REZONING },
            @{ Name = 'ember_monthly_patch'
               Source = Join-Path $verveRoot 'ember\monthly_full_release_long_format_patch.csv'
               Dest   = Join-Path $env:DEPLOY_ROOT 'data\ember\monthly_full_release_long_format_patch.csv'
               IsFile = $true },
            @{ Name = 'era5_demand_localtime'
               Source = Join-Path $verveRoot 'hourly_profiles\era5_combined_data_2030_localtime.csv'
               Dest   = Join-Path $env:DEPLOY_ROOT 'data\hourly_profiles\era5_combined_data_2030_localtime.csv'
               IsFile = $true },
            @{ Name = 'gem_re_units_cf_mapping'
               Source = Join-Path $verveRoot 'GlobalEnergyMonitor\re_units_cf_grid_cell_mapping.csv'
               Dest   = Join-Path $env:DEPLOY_ROOT 'data\GlobalEnergyMonitor\re_units_cf_grid_cell_mapping.csv'
               IsFile = $true }
          )

          $exitCodes = @()

          foreach ($job in $syncJobs) {
            $name   = $job.Name
            $source = $job.Source
            $dest   = $job.Dest
            $isFile = $job.IsFile -eq $true

            Write-Host '----'
            Write-Host ("Job: {0}" -f $name)
            Write-Host ("  Source: {0}" -f $source)
            Write-Host ("  Dest  : {0}" -f $dest)

            if (-not (Test-Path $source)) {
              Write-Host ("WARNING: Source does not exist: {0}" -f $source)
              continue
            }

            if ($isFile) {
              $destDir = Split-Path -Parent $dest
              if (-not (Test-Path $destDir)) {
                Write-Host ("Creating destination folder: {0}" -f $destDir)
                New-Item -ItemType Directory -Path $destDir -Force | Out-Null
              }
              Write-Host ("Copying file '{0}'..." -f $name)
              Copy-Item -Path $source -Destination $dest -Force
              continue
            }

            if (-not (Test-Path $dest)) {
              Write-Host ("Creating destination folder: {0}" -f $dest)
              New-Item -ItemType Directory -Path $dest | Out-Null
            }

            Write-Host ("Starting robocopy for '{0}'..." -f $name)
            robocopy $source $dest /E /Z /R:3 /W:5 /ETA /NP
            $exitCodes += $LASTEXITCODE

            Write-Host ("Robocopy exit code: {0}" -f $LASTEXITCODE)
          }

          $maxCode = ($exitCodes | Measure-Object -Maximum).Maximum

          Write-Host ("Max robocopy code = {0}" -f $maxCode)
          Write-Host 'INFO: 0–7 success, 8+ failure'

          if ($maxCode -ge 8) {
            Write-Host '### ERROR DETAIL: One or more sync jobs failed.'
            if ($log) { Stop-Transcript | Out-Null }
            exit $maxCode
          }

          Write-Host 'All data sync jobs completed successfully.'

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 1b) SYNC FULL VerveStacks FOLDER TO DEPLOY_ROOT
      #     (EXCLUDING .git, .github, .venv, node_modules)
      # ==========================================================
      - name: Sync full VerveStacks repo to DEPLOY_ROOT
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Sync full VerveStacks repo to DEPLOY_ROOT'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host ('### STEP FAILED: {0}' -f $stepName)
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host ('=== [{0}] ===' -f $stepName)

          $src = $env:REPO_SOURCE_ROOT
          $dst = $env:DEPLOY_ROOT

          Write-Host ("Source (REPO_SOURCE_ROOT) = {0}" -f $src)
          Write-Host ("Destination (DEPLOY_ROOT) = {0}" -f $dst)

          if (-not (Test-Path $src)) {
            Write-Host '### ERROR DETAIL: REPO_SOURCE_ROOT does not exist. Check REPO_SOURCE_ROOT.'
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          if (-not (Test-Path $dst)) {
            Write-Host ("Creating DEPLOY_ROOT (with parents if needed): {0}" -f $dst)
            [System.IO.Directory]::CreateDirectory($dst) | Out-Null
          }

          Write-Host 'Running robocopy for FULL VerveStacks sync (excluding .git, .github, .venv, node_modules)...'
          robocopy $src $dst /E /Z /R:3 /W:5 `
            /XD ".git" ".github" ".venv" "node_modules" `
            /NFL /NDL /NJH /NJS /NP

          $code = $LASTEXITCODE

          Write-Host ("Full repo robocopy exit code: {0}" -f $code)
          Write-Host 'INFO: Robocopy exit codes 0-7 are success/acceptable; 8 or higher indicates failure.'

          if ($code -ge 8) {
            Write-Host ("### ERROR DETAIL: Full repo robocopy failed (code {0}). Files may be partially copied." -f $code)
            if ($log) { Stop-Transcript | Out-Null }
            exit $code
          }

          Write-Host 'Full VerveStacks repo sync to DEPLOY_ROOT completed successfully.'

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 2) APP DEPLOY (COPY APP SOURCE TO DEPLOY_ROOT\APP_SUBROOT)
      #     (EXCLUDING .git, .github, .venv, node_modules)
      # ==========================================================
      - name: Deploy app from APP_SOURCE_ROOT to DEPLOY_ROOT\APP_SUBROOT
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Deploy app files to IIS folder'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host ('### STEP FAILED: {0}' -f $stepName)
            Write-Host ('### ERROR: {0}' -f $_.Exception.Message)
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host ('=== [{0}] ===' -f $stepName)

          $src = $env:APP_SOURCE_ROOT
          $dst = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT

          Write-Host ("Source (APP_SOURCE_ROOT) = {0}" -f $src)
          Write-Host ("Destination (DEPLOY_ROOT\APP_SUBROOT) = {0}" -f $dst)

          if (-not (Test-Path $src)) {
            Write-Host '### ERROR DETAIL: Source app folder does not exist. Check APP_SOURCE_ROOT.'
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          if (-not (Test-Path $dst)) {
            Write-Host ("Creating deployment folder (with parents if needed): {0}" -f $dst)
            [System.IO.Directory]::CreateDirectory($dst) | Out-Null
          }

          Write-Host 'Running robocopy for application deployment (excluding .git, .github, .venv, node_modules)...'
          robocopy $src $dst /E /Z /R:3 /W:5 `
            /XD ".git" ".github" ".venv" "node_modules" `
            /NFL /NDL /NJH /NJS /NP

          $code = $LASTEXITCODE

          Write-Host ("App robocopy exit code: {0}" -f $code)
          Write-Host 'INFO: Robocopy exit codes 0-7 are success/acceptable; 8 or higher indicates failure.'

          if ($code -ge 8) {
            Write-Host ("### ERROR DETAIL: Deployment robocopy failed (code {0}). Files may be partially copied." -f $code)
            if ($log) { Stop-Transcript | Out-Null }
            exit $code
          }

          Write-Host 'Deployment completed successfully (app folder synced to IIS target).'

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 3) BACKEND + FRONTEND (npm) ON DESTINATION
      # ==========================================================
      - name: Install JS deps and build frontend on DEPLOY_ROOT
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Install JS deps and build frontend'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host "### STEP FAILED: $stepName"
            Write-Host "### ERROR: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host "=== [$stepName] ==="

          $appRoot   = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT
          $backend   = Join-Path $appRoot 'backend'
          $frontend  = Join-Path $appRoot 'frontend'

          $apps = @(
            @{ Name = 'Backend'; Path = $backend; Build = $false },
            @{ Name = 'Frontend'; Path = $frontend; Build = $true }
          )

          foreach ($a in $apps) {
            $name  = $a.Name
            $path  = $a.Path
            $build = $a.Build

            Write-Host '----'
            Write-Host ("{0}: Path = {1}" -f $name, $path)

            if (-not (Test-Path $path)) {
              if ($name -eq 'Backend') {
                Write-Host ("WARNING: {0} path does not exist: {1} - skipping backend npm install." -f $name, $path)
                continue
              }
              else {
                Write-Host ("ERROR: {0} path does not exist: {1}" -f $name, $path)
                if ($log) { Stop-Transcript | Out-Null }
                exit 1
              }
            }

            cd $path

            $nodeModules = Join-Path $path 'node_modules'
            if (Test-Path $nodeModules) {
              Write-Host ("{0}: Removing existing node_modules for a clean install..." -f $name)
              try {
                # Method 1: Try robocopy to delete (fastest and most reliable for deep nested folders)
                Write-Host ("{0}: Using robocopy method to remove node_modules..." -f $name)
                $emptyDir = Join-Path $env:TEMP "empty_$(Get-Random)"
                New-Item -ItemType Directory -Path $emptyDir -Force | Out-Null
                robocopy $emptyDir $nodeModules /MIR /R:0 /W:0 /NFL /NDL /NJH /NJS /NP | Out-Null
                Remove-Item -Path $emptyDir -Force | Out-Null
                Remove-Item -Path $nodeModules -Force | Out-Null
                Write-Host ("{0}: node_modules removed successfully using robocopy method." -f $name)
              }
              catch {
                Write-Host ("{0}: Robocopy method failed, trying PowerShell with force..." -f $name)
                try {
                  # Method 2: PowerShell with more aggressive settings
                  Get-ChildItem -Path $nodeModules -Recurse -Force | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
                  Remove-Item -Path $nodeModules -Force -Recurse -ErrorAction Stop
                  Write-Host ("{0}: node_modules removed successfully using PowerShell method." -f $name)
                }
                catch {
                  # Method 3: If all else fails, try cmd rmdir
                  Write-Host ("{0}: PowerShell method failed, trying cmd rmdir..." -f $name)
                  try {
                    cmd /c "rmdir /s /q `"$nodeModules`""
                    if (Test-Path $nodeModules) {
                      throw "rmdir command failed - directory still exists"
                    }
                    Write-Host ("{0}: node_modules removed successfully using cmd rmdir." -f $name)
                  }
                  catch {
                    Write-Host ("WARNING: {0}: Could not completely remove node_modules: {1}" -f $name, $_.Exception.Message)
                    Write-Host ("{0}: Continuing with npm install anyway - npm will handle conflicts..." -f $name)
                  }
                }
              }
            }

            Write-Host ("{0}: running npm install..." -f $name)
            npm install
            if ($LASTEXITCODE -ne 0) {
              Write-Host ("{0}: npm install failed with exit code {1}" -f $name, $LASTEXITCODE)
              if ($log) { Stop-Transcript | Out-Null }
              exit 1
            }

            if ($build) {
              Write-Host ("{0}: running build:dev with CI=false..." -f $name)
              $env:CI = 'false'
              npm run build:dev
              if ($LASTEXITCODE -ne 0) {
                Write-Host ("{0}: npm run build:dev failed with exit code {1}" -f $name, $LASTEXITCODE)
                if ($log) { Stop-Transcript | Out-Null }
                exit 1
              }
            }
          }

          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 3b) PUBLISH FRONTEND BUILD TO IIS ROOT
      # ==========================================================
      # - name: Publish frontend build to IIS root
      #   shell: powershell
      #   run: |
      #     $stepName = 'Publish frontend build to IIS root'
      #     $log = $env:LOG_FILE

      #     if ($log) { Start-Transcript -Path $log -Append | Out-Null }

      #     $ErrorActionPreference = 'Stop'
      #     trap {
      #       Write-Host "### STEP FAILED: $stepName"
      #       Write-Host "### ERROR: $($_.Exception.Message)"
      #       Write-Host $_.ScriptStackTrace
      #       if ($log) { Stop-Transcript | Out-Null }
      #       exit 1
      #     }

      #     Write-Host "=== [$stepName] ==="

      #     $appRoot  = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT
      #     $buildDir = Join-Path $appRoot 'frontend\build'

      #     Write-Host ("App root  = {0}" -f $appRoot)
      #     Write-Host ("Build dir = {0}" -f $buildDir)

      #     if (-not (Test-Path $buildDir)) {
      #       Write-Host '### ERROR DETAIL: Frontend build directory not found. React build probably failed.'
      #       if ($log) { Stop-Transcript | Out-Null }
      #       exit 1
      #     }

      #     robocopy $buildDir $appRoot /E /R:3 /W:5 /NFL /NDL /NJH /NJS /NP
      #     $code = $LASTEXITCODE

      #     Write-Host ("Robocopy exit code (publish build) = {0}" -f $code)
      #     Write-Host 'INFO: Robocopy exit codes 0-7 are success/acceptable; 8 or higher indicates failure.'

      #     if ($code -ge 8) {
      #       Write-Host ("### ERROR DETAIL: Failed to publish frontend build to IIS root (code {0})." -f $code)
      #       if ($log) { Stop-Transcript | Out-Null }
      #       exit $code
      #     }

      #     Write-Host 'Frontend build published to IIS root successfully.'

      #     if ($log) { Stop-Transcript | Out-Null }
      #     exit 0

      # ==========================================================
      # 4) PYTHON SERVICE SETUP (STATIC vs PER-DEPLOY VENV)
      # ==========================================================
      - name: Setup python service environment
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        run: |
          $stepName = 'Setup python service'
          $log = $env:LOG_FILE

          if ($log) { Start-Transcript -Path $log -Append | Out-Null }

          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host "### STEP FAILED: $stepName"
            Write-Host "### ERROR: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host "=== [$stepName] ==="

          $appRoot        = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT
          $pythonSvcRoot  = Join-Path $appRoot 'python-service'
          $staticVenvRoot = $env:STATIC_VENV_ROOT
          $createNew      = $env:CREATE_NEW_VENV

          Write-Host ("Python service path = {0}" -f $pythonSvcRoot)
          Write-Host ("CREATE_NEW_VENV     = {0}" -f $createNew)
          Write-Host ("STATIC_VENV_ROOT    = {0}" -f $staticVenvRoot)
          Write-Host ("PYTHON_EXE          = {0}" -f $env:PYTHON_EXE)

          if (-not (Test-Path $pythonSvcRoot)) {
            Write-Host '### ERROR DETAIL: python-service folder not found under app root.'
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Set-Location $pythonSvcRoot

          if ($createNew -eq 'true') {
            Write-Host 'Using per-deploy virtual environment under python-service\.venv'

            if (Test-Path '.venv') {
              Write-Host 'Removing existing virtual environment .venv...'
              try {
                Remove-Item -Recurse -Force '.venv'
              }
              catch {
                Write-Host ("### ERROR: Failed to delete old .venv: {0}" -f $_.Exception.Message)
                if ($log) { Stop-Transcript | Out-Null }
                exit 1
              }
            }

            Write-Host 'Creating virtual environment in .venv using PYTHON_EXE...'
            & $env:PYTHON_EXE -m venv .venv
            if ($LASTEXITCODE -ne 0) {
              Write-Host ("### ERROR: python -m venv .venv failed with exit code {0}" -f $LASTEXITCODE)
              if ($log) { Stop-Transcript | Out-Null }
              exit $LASTEXITCODE
            }

            $venvPython = Join-Path $pythonSvcRoot '.venv\Scripts\python.exe'
          }
          else {
            Write-Host 'Using static virtual environment at STATIC_VENV_ROOT'

            if (-not (Test-Path $staticVenvRoot)) {
              Write-Host ("### ERROR DETAIL: STATIC_VENV_ROOT not found: {0}" -f $staticVenvRoot)
              if ($log) { Stop-Transcript | Out-Null }
              exit 1
            }

            $venvPython = Join-Path $staticVenvRoot 'python.exe'
          }

          Write-Host ("Resolved venv python = {0}" -f $venvPython)

          if (-not (Test-Path $venvPython)) {
            Write-Host ("### ERROR DETAIL: Python executable not found at {0}" -f $venvPython)
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host 'Installing/Updating Python dependencies from requirements.txt...'
          & $venvPython -m pip install --upgrade "pip"
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("### ERROR: pip upgrade failed with exit code {0}" -f $LASTEXITCODE)
            if ($log) { Stop-Transcript | Out-Null }
            exit $LASTEXITCODE
          }

          $requirements = Join-Path $pythonSvcRoot 'requirements.txt'
          if (-not (Test-Path $requirements)) {
            Write-Host ("### ERROR DETAIL: requirements.txt not found at {0}" -f $requirements)
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          & $venvPython -m pip install -r $requirements
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("### ERROR: pip install -r requirements.txt failed with exit code {0}" -f $LASTEXITCODE)
            if ($log) { Stop-Transcript | Out-Null }
            exit $LASTEXITCODE
          }

          Write-Host 'Python environment ready and dependencies installed successfully.'
          if ($log) { Stop-Transcript | Out-Null }
          exit 0

      # ==========================================================
      # 5) UPDATE DATABASE (run Python + BAT scripts)
      # ==========================================================
      - name: Update Database
        if: env.Update_Data_On_Local == 'true' && env.RUN_ONLY_DB_STEP == 'false'
        shell: powershell
        env:
          # Optional: DB connection info if your scripts need it
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          $stepName = 'Update Database'
          $log = $env:LOG_FILE
          if ($log) { Start-Transcript -Path $log -Append | Out-Null }
          $ErrorActionPreference = 'Stop'
          trap {
            Write-Host "### STEP FAILED: $stepName"
            Write-Host "### ERROR: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          Write-Host "=== [$stepName] ==="

          # 1) Resolve paths
          $appRoot  = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT
          $dbFolder = Join-Path $appRoot 'backend\database'

          Write-Host ("App root   = {0}" -f $appRoot)
          Write-Host ("DB folder  = {0}" -f $dbFolder)

          if (-not (Test-Path $dbFolder)) {
            Write-Host "### ERROR: DB folder not found: $dbFolder"
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }
          $env:PYTHONIOENCODING = 'utf-8'

          Write-Host ("Changing working directory to DB folder: {0}" -f $dbFolder)
          Set-Location $dbFolder
          Write-Host ("Current directory is now: {0}" -f (Get-Location))
          
          # 2) Python exe (reuse configured one)
          $appRoot    = Join-Path $env:DEPLOY_ROOT $env:APP_SUBROOT
          $venvPython = Join-Path $env:STATIC_VENV_ROOT 'python.exe'
          $pythonExe  = $venvPython

          Write-Host ("Using venv PYTHON_EXE = {0}" -f $pythonExe)

          if (-not (Test-Path $pythonExe)) {
            Write-Host "### ERROR: venv python not found at $pythonExe"
            Write-Host "Make sure the 'Setup python service' step ran successfully before this one."
            if ($log) { Stop-Transcript | Out-Null }
            exit 1
          }

          # 3) LIST OF SCRIPTS TO RUN (EDIT THESE NAMES to your real files)
          #    They are assumed to live under backend\database
          $pythonScripts = @(
            'consolidate_generation_plants.py',    
            'convert_geojson.py'      
          )

          # All batch scripts will be run in interactive mode with timeout protection
          # Order: setup_database.bat -> run_renewable_imports.bat -> setup_procedures.bat
          $interactiveBatchScripts = @(
            'setup_database.bat',
            'run_renewable_imports.bat',      
            'setup_procedures.bat'
          )

          # 4) Helper to run a command and check exit code
          function Invoke-Checked {
            param(
              [string]$Description,
              [scriptblock]$Action
            )
            Write-Host ''
            Write-Host ("---- Running: {0}" -f $Description)
            & $Action
            $rc = $LASTEXITCODE
            Write-Host ("Exit code = {0}" -f $rc)
            if ($rc -ne 0) {
              Write-Host ("### ERROR: Step '{0}' failed with exit code {1}." -f $Description, $rc)
              if ($log) { Stop-Transcript | Out-Null }
              exit $rc
            }
          }

          # 5) Run Python scripts in order
          foreach ($name in $pythonScripts) {
            $path = Join-Path $dbFolder $name
            Write-Host ("Python script path = {0}" -f $path)

            if (-not (Test-Path $path)) {
              Write-Host ("### ERROR: Python file not found: {0}" -f $path)
              if ($log) { Stop-Transcript | Out-Null }
              exit 1
            }

            Invoke-Checked -Description ("python {0}" -f $name) -Action {
              & $pythonExe $path
            }
          }

          # 6) Run all BAT files in interactive mode with timeout protection
          # Set PostgreSQL password and other environment variables
          if ($env:DB_PASSWORD) {
            $env:PGPASSWORD = $env:DB_PASSWORD
            Write-Host "Using DB_PASSWORD from secrets for PostgreSQL authentication."
          }
          else {
            Write-Host "WARNING: No DB_PASSWORD secret found. Scripts requiring password may fail."
          }

          # Set database connection environment variables for batch scripts
          if ($env:DB_HOST) { $env:PG_HOST = $env:DB_HOST }
          if ($env:DB_PORT) { $env:PG_PORT = $env:DB_PORT }  
          if ($env:DB_USER) { $env:PG_USER = $env:DB_USER }
          if ($env:DB_NAME) { $env:DB_NAME = $env:DB_NAME }

          try {
            foreach ($name in $interactiveBatchScripts) {
              $path = Join-Path $dbFolder $name
              Write-Host ""
              Write-Host ("---- Running {0} in non-interactive mode ----" -f $name)
              Write-Host ("BAT script path = {0}" -f $path)

              if (-not (Test-Path $path)) {
                Write-Host ("WARNING: BAT file not found: {0} - skipping" -f $path)
                continue
              }

              # Create unique log files for each script
              $baseName = [System.IO.Path]::GetFileNameWithoutExtension($name)
              $outputLog = "$dbFolder\${baseName}_output.log"
              $errorLog = "$dbFolder\${baseName}_error.log"

              # Create a modified version of the batch file that doesn't use pause
              $tempBatPath = "$dbFolder\temp_${baseName}.bat"
              Write-Host ("Creating non-interactive version: {0}" -f $tempBatPath)
              
              try {
                # Read original batch file and modify it
                $batContent = Get-Content $path -Raw
                
                 # Make comprehensive modifications for automation
                 Write-Host "Modifying batch file for non-interactive execution with password argument..."
                 
                 # Start with proper batch file header that accepts password as argument
                 $headerContent = "@echo off`r`n"
                 $headerContent += "setlocal enabledelayedexpansion`r`n"
                 $headerContent += "rem Automated version of $name`r`n"
                 $headerContent += "`r`n"
                 $headerContent += "rem Get password from first argument`r`n"
                 $headerContent += "if not `"%~1`"==`"`" (`r`n"
                 $headerContent += "    set `"PGPASSWORD=%~1`"`r`n"
                 $headerContent += "    echo [AUTOMATED MODE] Using password from argument`r`n"
                 $headerContent += ") else (`r`n"
                 $headerContent += "    echo [AUTOMATED MODE] No password argument provided`r`n"
                 $headerContent += "    set `"PGPASSWORD=`"`r`n"
                 $headerContent += ")`r`n"
                 $headerContent += "`r`n"
                 
                 # Remove all pause commands
                 $modifiedContent = $batContent -replace 'pause', 'echo [AUTOMATED MODE - pause removed]'
                 
                 # Remove interactive password prompts and replace with argument usage
                 $modifiedContent = $modifiedContent -replace 'if "%PGPASSWORD%"=="" \([\s\S]*?\)', 'if "%PGPASSWORD%"=="" ( echo [AUTOMATED MODE] PGPASSWORD already set from argument )'
                 $modifiedContent = $modifiedContent -replace 'set /p PGPASSWORD=.*', 'echo [AUTOMATED MODE - using PGPASSWORD from argument]'
                 
                 # Remove any other interactive prompts
                 $modifiedContent = $modifiedContent -replace 'set /p [^=]*=.*', 'echo [AUTOMATED MODE - prompt removed]'
                 
                 # Replace psql connection tests that might hang with non-interactive versions
                 $modifiedContent = $modifiedContent -replace 'psql.*-c.*"SELECT.*".*>nul 2>&1', 'echo [AUTOMATED MODE - connection test skipped, assuming success]'
                 
                 # Add non-interactive flags to psql commands
                 $modifiedContent = $modifiedContent -replace '(psql\s+[^|]*?)(\s+[^|]*?)(\s*$)', '$1$2 --no-password$3'
                 
                 # Combine header with modified content
                 $modifiedContent = $headerContent + $modifiedContent
                 
                 # Add explicit success exit at the end
                 $modifiedContent += "`r`necho [AUTOMATED MODE] Script execution completed.`r`nexit /b 0"
                
                 # Write modified batch file
                 Set-Content -Path $tempBatPath -Value $modifiedContent -Encoding ASCII
                 
                #  # Debug: Show first few lines of the modified batch file
                #  Write-Host "First 10 lines of modified batch file:"
                #  Get-Content $tempBatPath -TotalCount 10 | ForEach-Object { Write-Host "  $_" }
                
                 Write-Host ("Running {0} (no timeout - will wait for completion)..." -f $name)
                
                 # Prepare arguments for batch file (pass DB_PASSWORD as argument)
                 $dbPassword = if ($env:DB_PASSWORD) { $env:DB_PASSWORD } else { "" }
                 
                 # Construct single command string for batch file with password
                 $batCommand = "`"$tempBatPath`" $dbPassword"
                 $processArgs = @("/c", $batCommand)

                 $passwordStatus = if ($env:DB_PASSWORD) { "provided" } else { "not provided" }
                 Write-Host "Running batch file with password argument ($passwordStatus)..."
                 Write-Host "Command: cmd.exe /c $batCommand"
                 
                 # Use Start-Process with timeout to prevent hanging
                 $process = Start-Process -FilePath "cmd.exe" `
                                       -ArgumentList $processArgs `
                                       -WorkingDirectory $dbFolder `
                                       -WindowStyle Hidden `
                                       -PassThru `
                                       -RedirectStandardOutput $outputLog `
                                       -RedirectStandardError $errorLog
                
                 # Wait for process to complete (no timeout)
                 Write-Host "Waiting for $name to complete..."
                 $process.WaitForExit()
                 
                 try {
                   $exitCode = $process.ExitCode
                   if ($exitCode -eq $null -or $exitCode -eq "") {
                     $exitCode = "unknown"
                   }
                 }
                 catch {
                   $exitCode = "error_getting_code"
                 }
                 
                 Write-Host ("{0} completed with exit code: {1}" -f $name, $exitCode)
                 
                 # Show output logs
                 if (Test-Path $outputLog) {
                   Write-Host ("--- {0} Output ---" -f $name)
                   Get-Content $outputLog | Write-Host
                 }
                 if (Test-Path $errorLog) {
                   $errorContent = Get-Content $errorLog -ErrorAction SilentlyContinue
                   if ($errorContent) {
                     Write-Host ("--- {0} Errors ---" -f $name)
                     $errorContent | Write-Host
                   }
                 }
                 
                 if ($exitCode -eq 0) {
                   Write-Host ("{0} completed successfully." -f $name)
                 }
                 elseif ($exitCode -eq "unknown") {
                   Write-Host ("WARNING: {0} completed but exit code could not be determined. Check logs above." -f $name)
                   Write-Host "Continuing with remaining scripts..."
                 }
                 else {
                   Write-Host ("WARNING: {0} failed with exit code {1}. Check logs above." -f $name, $exitCode)
                   Write-Host "Continuing with remaining scripts..."
                 }
              }
              catch {
                Write-Host ("WARNING: Error running {0}: {1}" -f $name, $_.Exception.Message)
                Write-Host "Continuing with remaining scripts..."
              }
              finally {
                # Clean up temporary batch file
                if (Test-Path $tempBatPath) {
                  Remove-Item $tempBatPath -Force -ErrorAction SilentlyContinue
                }
              }
            }
          }
          finally {
            # Clean up environment variables
            if ($env:PGPASSWORD) { Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue }
            if ($env:PG_HOST) { Remove-Item Env:PG_HOST -ErrorAction SilentlyContinue }
            if ($env:PG_PORT) { Remove-Item Env:PG_PORT -ErrorAction SilentlyContinue }
            if ($env:PG_USER) { Remove-Item Env:PG_USER -ErrorAction SilentlyContinue }
            if ($env:DB_NAME) { Remove-Item Env:DB_NAME -ErrorAction SilentlyContinue }
          }

          Write-Host ""
          Write-Host "Database update process completed."
          if ($log) { Stop-Transcript | Out-Null }
          exit 0
